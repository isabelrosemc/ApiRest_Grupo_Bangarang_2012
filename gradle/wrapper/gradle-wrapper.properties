# ================================================================================================
# Archivo   : gradle/wrapper/gradle-wrapper.properties
# Propósito : Fija la versión de Gradle compatible con AGP 8.13.2 (Gradle 8.13).
# ================================================================================================


# Carpeta base donde se guarda la distribución descargada de Gradle
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists


# Versión de Gradle que se descargará (no modificar)
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip


# Tiempo de espera de red (ms) y validación de la URL de descarga
networkTimeout=10000
validateDistributionUrl=true


# Carpeta donde se guarda el archivo comprimido descargado
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
