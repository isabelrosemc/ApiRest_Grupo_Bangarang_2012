# ================================================================================================
# Archivo   : gradle.properties (raíz del proyecto)
# Propósito : Opciones globales de Gradle. En este formato los comentarios van en su propia línea.
# ================================================================================================


# Memoria máxima del proceso de Gradle y codificación de los archivos fuente
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8


# Obliga a usar las librerías AndroidX (requerido por Compose y Material 3)
android.useAndroidX=true


# Estilo de código oficial de Kotlin
kotlin.code.style=official


# Cada módulo usa solo su propia clase R (compilación más rápida)
android.nonTransitiveRClass=true
